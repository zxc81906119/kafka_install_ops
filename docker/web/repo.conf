# Internal repository, HTTPS only, read-only. Certificate issued by the bank CA (windows/repo-web.sh cert),
# bind-mounted from docker/web/tls/.
Listen 443 https
<VirtualHost *:443>
    ServerName repo01.poc.lab
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/pki/repo-tls/repo.crt
    SSLCertificateKeyFile /etc/pki/repo-tls/repo.key
    DocumentRoot "/var/www/repo"
    <Directory "/var/www/repo">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
        <LimitExcept GET HEAD OPTIONS>
            Require all denied
        </LimitExcept>
    </Directory>
</VirtualHost>
