# Full manual install (no cpctl) - a second, independent set of simulated hosts.
# Same host names as the cpctl PoC (*.poc.lab) except the operator host, which is ops02 and starts BARE
# (cp-node image: no httpd, no repo, no tools). Separate network and volumes; the cp-poc project is untouched.
#   docker compose -f docker/manual/compose.yml up -d
name: cp-man

x-hosts: &hosts
  - "ops02.poc.lab=172.32.0.10"
  - "ops02=172.32.0.10"
  - "ad01.poc.lab=172.32.0.11"
  - "ad01=172.32.0.11"
  - "lb01.poc.lab=172.32.0.12"
  - "lb01=172.32.0.12"
  - "rest.poc.lab=172.32.0.12"
  - "c3.poc.lab=172.32.0.12"
  - "jump01.poc.lab=172.32.0.13"
  - "jump01=172.32.0.13"
  - "kc01.poc.lab=172.32.0.21"
  - "kc01=172.32.0.21"
  - "kc02.poc.lab=172.32.0.22"
  - "kc02=172.32.0.22"
  - "kc03.poc.lab=172.32.0.23"
  - "kc03=172.32.0.23"
  - "kb01.poc.lab=172.32.0.31"
  - "kb01=172.32.0.31"
  - "kb02.poc.lab=172.32.0.32"
  - "kb02=172.32.0.32"
  - "kb03.poc.lab=172.32.0.33"
  - "kb03=172.32.0.33"
  - "kb04.poc.lab=172.32.0.34"
  - "kb04=172.32.0.34"
  - "rest01.poc.lab=172.32.0.41"
  - "rest01=172.32.0.41"
  - "rest02.poc.lab=172.32.0.42"
  - "rest02=172.32.0.42"
  - "c3-01.poc.lab=172.32.0.51"
  - "c3-01=172.32.0.51"

x-node: &node
  image: cp-node:poc
  domainname: poc.lab
  privileged: true
  cgroup: host
  stop_signal: SIGRTMIN+3
  tmpfs:
    - /run
    - /run/lock
    - /tmp:exec,mode=1777,size=2g
  volumes:
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    - ssh-keys:/etc/ssh/authorized_keys.d:ro   # = the bank's account provisioning (cpadmin public key)
  extra_hosts: *hosts
  environment:
    TZ: Asia/Taipei
  ulimits:
    nofile: { soft: 128000, hard: 128000 }
    nproc: 65536
  restart: unless-stopped

services:
  ops02:
    <<: *node
    hostname: ops02
    networks: { mannet: { ipv4_address: 172.32.0.10 } }
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ssh-keys:/etc/ssh/authorized_keys.d
      - ../../packages-manual:/mnt/exchange:ro      # landing zone, read-only
      - ops-state:/var/lib/cp-installer
      - ops-repo:/srv/repo
      - ops-home:/home/cpadmin

  ad01:
    image: cp-ad:poc
    hostname: ad01
    domainname: poc.lab
    privileged: true
    networks: { mannet: { ipv4_address: 172.32.0.11 } }
    extra_hosts: *hosts
    env_file: secrets.env
    environment:
      AD_REALM: CORP.POC.LAB
      AD_DOMAIN: CORP
      TZ: Asia/Taipei
    volumes:
      - ssh-keys:/etc/ssh/authorized_keys.d:ro
      - ad-data:/var/lib/samba
      - ad-etc:/etc/samba
    restart: unless-stopped

  lb01:
    image: cp-lb:poc
    hostname: lb01
    domainname: poc.lab
    networks:
      mannet: { ipv4_address: 172.32.0.12 }
      manfront: { ipv4_address: 172.33.0.12 }
    ports:
      - "18082:8082"
      - "19021:9021"
    extra_hosts: *hosts
    environment:
      TZ: Asia/Taipei
    volumes:
      - ssh-keys:/etc/ssh/authorized_keys.d:ro
    restart: unless-stopped

  jump01: { <<: *node, hostname: jump01, networks: { mannet: { ipv4_address: 172.32.0.13 } } }
  kc01: { <<: *node, hostname: kc01, networks: { mannet: { ipv4_address: 172.32.0.21 } } }
  kc02: { <<: *node, hostname: kc02, networks: { mannet: { ipv4_address: 172.32.0.22 } } }
  kc03: { <<: *node, hostname: kc03, networks: { mannet: { ipv4_address: 172.32.0.23 } } }
  kb01: { <<: *node, hostname: kb01, networks: { mannet: { ipv4_address: 172.32.0.31 } } }
  kb02: { <<: *node, hostname: kb02, networks: { mannet: { ipv4_address: 172.32.0.32 } } }
  kb03: { <<: *node, hostname: kb03, networks: { mannet: { ipv4_address: 172.32.0.33 } } }
  kb04: { <<: *node, hostname: kb04, networks: { mannet: { ipv4_address: 172.32.0.34 } } }
  rest01: { <<: *node, hostname: rest01, networks: { mannet: { ipv4_address: 172.32.0.41 } } }
  rest02: { <<: *node, hostname: rest02, networks: { mannet: { ipv4_address: 172.32.0.42 } } }
  c3-01:
    <<: *node
    hostname: c3-01
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: { mannet: { ipv4_address: 172.32.0.51 } }

networks:
  mannet:
    internal: true
    ipam: { config: [ { subnet: 172.32.0.0/24 } ] }
  manfront:
    ipam: { config: [ { subnet: 172.33.0.0/24 } ] }

volumes:
  ssh-keys:
  ops-state:
  ops-repo:
  ops-home:
  ad-data:
  ad-etc:
