# ============================================================================
# cbom/cbomkit-demo 的設定（demo.sh 和 check.mjs 都讀這個檔；要改 port 或版本只改這裡）
#
# 容器名稱都用 demo- 開頭，自己的網路與 port。
#
# 格式：一行一個「名稱=值」，值不能有空白，等號兩邊不能有空白；「#」後面是註解。
# 兩個讀法：demo.sh 用 bash 的 source；check.mjs 自己一行一行讀（只認這種簡單的寫法，不要用引號或 $變數）。
# ============================================================================

NETWORK=cbomdemo

# 映像檔（版本釘死）。GIT_IMAGE 是 nginx：用來放 web app 的 git repo，也拿來開臨時容器看可用記憶體
# OPA 這裡是 1.22.2；web app 的 pipeline 用的 OPA 是 cbom/webapp/lab.sh 下載的執行檔（OPA_VERSION），兩邊各自釘版本
CBOMKIT_API_IMAGE=ghcr.io/cbomkit/cbomkit:2.3.0
CBOMKIT_UI_IMAGE=ghcr.io/cbomkit/cbomkit-frontend:2.3.0
DB_IMAGE=docker.io/library/postgres:16.15-alpine
OPA_IMAGE=docker.io/openpolicyagent/opa:1.22.2-static
GIT_IMAGE=docker.io/library/nginx:1.27-alpine

# 主機上的 port（API 是給網頁與 check.mjs 呼叫的；人只開網頁 A、B）
# docs/demo-src/tools/shots.mjs 與 compare.mjs 裡也寫了這四個 port 與 Jenkins 的 port，改這裡時那兩支要一起改
BUILTIN_API_PORT=28083
BUILTIN_UI_PORT=28084       # 網頁 A：內建檢查
OPA_API_PORT=28085
OPA_UI_PORT=28086           # 網頁 B：OPA 檢查

# 啟動前要有這麼多可用記憶體（MB）；不夠時 up 會停下來
# （這是啟動前的門檻，不是各容器上限的總和：demo.sh 裡各容器的 --memory 是 API 2g ×2、資料庫 512m、網頁與 OPA 256m ×3、nginx 64m）
NEED_MEMORY_MB=3000

# web app 的 Jenkins（bash cbom/webapp/lab.sh up 建的；up --jenkins 會啟動它，並接上這個 demo 的網路）
JENKINS_CONTAINER=cbom-jenkins
JENKINS_PORT=18089

# 要掃描的 web app（cbom/app）：demo.sh 把它做成一個臨時 git repo，這是那個 repo 的分支名稱與 CBOMkit 上要貼的網址
APP_BRANCH=main
GIT_URL=http://demo-git/local/crypto-lab
