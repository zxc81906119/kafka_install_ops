global:
  scrape_interval: 60s
  evaluation_interval: 60s
alerting:
  alertmanagers:
    - scheme: https
      tls_config:
        ca_file: /etc/confluent/ssl/ca.pem
        cert_file: /etc/confluent/ssl/svc-c3.crt
        key_file: /etc/confluent/ssl/svc-c3.key
      static_configs:
        - targets:
            - ${C3_FQDN}:9093
      alert_relabel_configs:
        - source_labels: [target]
          regex: omnibus
          action: drop
    - scheme: http
      static_configs:
        - targets:
            - 127.0.0.1:9193
      alert_relabel_configs:
        - source_labels: [target]
          regex: omnibus
          action: keep
rule_files:
  - "recording_rules-generated.yml"
  - "trigger_rules-generated.yml"
  - "custom-rules-rest.yml"
scrape_configs:
  - job_name: rest-proxy
    scheme: https
    tls_config:
      ca_file: /etc/confluent/ssl/ca.pem
    static_configs:
      - targets: [${REST_SCRAPE_TARGETS}]
otlp:
  promote_resource_attributes: ["host.hostname", "java.version", "kafka.broker.id", "kafka.cluster.id", "kafka.version", "type"]
storage:
  tsdb:
    out_of_order_time_window: 10m
