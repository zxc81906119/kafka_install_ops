global:
  scrape_interval: 60s
  evaluation_interval: 60s
alerting:
  alertmanagers:
    - scheme: https
      tls_config:
        ca_file: /etc/confluent/ssl/ca.pem
        cert_file: /etc/confluent/ssl/cp-server.crt
        key_file: /etc/confluent/ssl/cp-server.key
      static_configs:
        - targets:
            - ${C3_FQDN}:9093
rule_files:
  - "recording_rules-generated.yml"
  - "trigger_rules-generated.yml"
scrape_configs:
