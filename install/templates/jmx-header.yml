# Prometheus JMX exporter: HTTPS with this host's certificate, basic auth with a salted SHA-256 (no plaintext scrape password here)
# 這一段接在 Confluent 官方的規則檔前面（官方檔自己帶 lowercaseOutputName 等設定，所以這裡只放 httpServer）
httpServer:
  ssl:
    keyStore:
      filename: /etc/confluent/ssl/${KS}.p12
      password: ${STORE_PASSWORD}
      type: PKCS12
    certificate:
      alias: ${KS}
  authentication:
    basic:
      username: prometheus
      passwordHash: ${HASH}
      algorithm: SHA-256
      salt: ${SALT}
