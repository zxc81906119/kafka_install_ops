groups:
  - name: rest-proxy
    labels:
      target: omnibus
    rules:
      - alert: C3RestProxyDown
        expr: up{job="rest-proxy"} == 0
        for: 1m
        labels: { severity: critical, impact: SERVICE }
        annotations:
          summary: "REST Proxy {{ $labels.instance }} is down"
          description: 'REST Proxy {{ $labels.instance }} stopped: check the service'
